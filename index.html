<html lang="en">

    <title>Link Your Garmin Account</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #111; font-size: 24px; text-align: center; }
        p { color: #666; font-size: 14px; text-align: center; margin-bottom: 25px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input:focus { outline: none; border-color: #007bff; background-color: #fff; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .hidden { display: none !important; }
        #statusMessage {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            line-height: 1.4;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }

        /* Instant Display Pairing Code Box */
        .code-box {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            text-align: center;
        }
        .code-box h3 { margin: 0 0 4px 0; font-size: 16px; color: #0f172a; }
        .code-box ol { font-size: 13px; color: #475569; margin: 15px 0 0 0; padding-left: 20px; text-align: left; line-height: 1.5; }
        .code-box li { margin-bottom: 8px; }
        .code-box li:last-child { margin-bottom: 0; }
        .code-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #1e3a8a;
            margin: 15px 0;
            background: #edd89a;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #b45309;
        }

        /* Stripe Checkout Container Styles */
        .paygate-box {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f8fafc;
            text-align: center;
        }
        .paygate-box h3 { margin: 0 0 8px 0; font-size: 16px; color: #1e293b; }
